# =============================================================================
# pyproject.toml
# Project : Non-Profit Spending Reports
# Date    : 2026-10-26
# Purpose : Python package, dependencies and tool settings for the IRS 990
#           pipeline and static page generator (nppipe).
# Usage   : (WSL) UV_PROJECT_ENVIRONMENT=~/venvs/np uv sync
#           uv run pytest ; uv run ruff check .
# Change log:
#   2026-10-26  0.1.0  Initial version.
# =============================================================================
[project]
name = "nppipe"
version = "0.1.0"
description = "Builds the Non-Profit Spending Reports static site from public IRS Form 990 data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "jinja2>=3.1.6",
  "psycopg[binary]>=3.2",
  "defusedxml>=0.7.1",
  "inflate64>=1.0.4",  # LGPL-2.1-or-later; reads Deflate64 zips
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.13",
  "pip-audit>=2.9",
]

[project.scripts]
nppipe = "nppipe.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nppipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM"]
ignore = ["S101"]  # assert is how pytest works

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
